name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - .engineering/project.yaml
      - .engineering/schemas/**
      - .github/workflows/pages.yml
      - blog/**
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore schema contract tooling
        id: protocol-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/protocol
          key: protocol-cli-${{ runner.os }}-${{ runner.arch }}-79b641c9c75411627669dfce7f0bac04d4472463

      - name: Install schema contract tooling
        if: steps.protocol-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked
          --git https://github.com/beyond10x/engineering-protocols.git
          --rev 79b641c9c75411627669dfce7f0bac04d4472463
          protocol-cli

      - name: Validate project schema instances
        run: >-
          protocol schema validate
          docs/principles.json
          docs/research/evidence/scoped-progress-partial-failure/*.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: website
        run: npm audit --audit-level=critical

      - name: Check generated schema projection
        working-directory: website
        run: npm run schema:check

      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
