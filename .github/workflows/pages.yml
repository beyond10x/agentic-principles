# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Keeps the repository's schema, audit, type and Docusaurus checks after delivery moved to Website.
name: Documentation validation

on:
  push:
    branches: [main]
    paths:
      - .engineering/project.yaml
      - .engineering/schemas/**
      - .github/workflows/pages.yml
      - blog/**
      - docs/**
      - website/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore schema contract tooling
        id: ess-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ess
          key: ess-cli-${{ runner.os }}-${{ runner.arch }}-0.2.1

      - name: Install schema contract tooling
        if: steps.ess-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked
          --git https://github.com/beyond10x/ess.git
          --tag 0.2.1
          ess-cli

      - name: Validate project schema instances
        run: >-
          ess schema validate
          docs/principles.json
          docs/research/evidence/scoped-progress-partial-failure/*.json
          --schemas .engineering/schemas

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: website
        run: npm audit --audit-level=critical

      - name: Check generated schema projection
        working-directory: website
        run: npm run schema:check

      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build
