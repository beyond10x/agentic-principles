name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - .engineering/project.yaml
      - .engineering/schemas/**
      - .github/workflows/pages.yml
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install schema contract tooling
        run: >-
          cargo install --locked
          --git https://github.com/beyond10x/engineering-protocols.git
          --rev 79b641c9c75411627669dfce7f0bac04d4472463
          protocol-cli

      - name: Validate project schema instances
        run: >-
          protocol schema validate
          docs/principles.json
          docs/research/evidence/scoped-progress-partial-failure/*.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: website
        run: npm audit --audit-level=critical

      - name: Check generated schema projection
        working-directory: website
        run: npm run schema:check

      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
